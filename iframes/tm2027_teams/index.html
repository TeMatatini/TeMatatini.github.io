<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Te Matatini o Ngā Taniwha - Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Display face: Petrona. Swapped in from Fraunces, which has no mark-positioning
     table, so a macron that gets decomposed detaches from its vowel. To try another,
     change the family here AND --display below. Tested, all with mark positioning,
     tabular numerals and full te reo Māori coverage:
       Petrona   family=Petrona:wght@100..900
       Literata  family=Literata:opsz,wght@7..72,200..900
       Newsreader family=Newsreader:opsz,wght@6..72,200..800   (max weight 800) -->
<link href="https://fonts.googleapis.com/css2?family=Petrona:wght@100..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#181210; --ink-2:#221813; --ink-3:#2c2019; --line:#3a2c22;
    --bone:#efe5d4; --bone-dim:#bdab93;
    --whero:#cf4327; --whero-deep:#a8311d; --kowhai:#e0a93f; --pounamu:#5c9079;
    /* pool colours sampled from the official Te Matatini draw graphics */
    --ihu:#8e9a38; --haumi:#5b662c; --kei:#c15527; --awa:#32acb1;
    --radius:14px; --maxw:1180px;
    --display:'Petrona', Georgia, 'Times New Roman', serif;
  }
  [data-pool="Te Ihu"]{--pool:var(--ihu)}
  [data-pool="Te Haumi"]{--pool:var(--haumi)}
  [data-pool="Te Kei"]{--pool:var(--kei)}
  [data-pool="Te Awa"]{--pool:var(--awa)}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;color-scheme:dark;scroll-padding-top:96px}
  body{background:var(--ink);color:var(--bone);font-family:'Inter',system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  ::selection{background:var(--whero);color:#fff}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px}

    /* the artwork is white already; this only softens it against the warm ink */
    filter:drop-shadow(0 2px 14px rgba(0,0,0,.45))}
  .stat .n{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,3.2vw,2.4rem);line-height:1;color:var(--kowhai)}
  .stat .l{margin-top:8px;font-size:.78rem;letter-spacing:.04em;color:var(--bone-dim);text-transform:uppercase}

  /* Controls */
  .controls{position:sticky;top:0;z-index:30;background:rgba(24,18,16,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);margin-top:0;padding:12px 0}
  .controls-inner{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .search{position:relative;flex:1 1 240px;min-width:200px}
  .search input{width:100%;background:var(--ink-2);border:1px solid var(--line);color:var(--bone);font-family:inherit;font-size:.95rem;padding:12px 14px 12px 42px;border-radius:100px;outline:none;transition:border-color .2s,box-shadow .2s}
  .search input::placeholder{color:#7d6e5c}
  .search input:focus{border-color:var(--kowhai);box-shadow:0 0 0 3px rgba(224,169,63,.16)}
  .search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:17px;height:17px;stroke:#8a7a66;fill:none}

  .ctl-label{font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:#8a7a66;font-weight:600;margin-right:-4px}
  .select{position:relative;display:inline-flex;align-items:center}
  .select select{appearance:none;-webkit-appearance:none;background:var(--ink-2);border:1px solid var(--line);color:var(--bone);font-family:inherit;font-size:.84rem;font-weight:500;padding:10px 34px 10px 14px;border-radius:100px;cursor:pointer;transition:border-color .2s}
  .select select:hover{border-color:var(--bone-dim)}
  .select::after{content:"";position:absolute;right:15px;pointer-events:none;width:7px;height:7px;border-right:2px solid var(--bone-dim);border-bottom:2px solid var(--bone-dim);transform:translateY(-2px) rotate(45deg)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:var(--ink-2)}
  .seg button{font:inherit;font-size:.84rem;font-weight:500;color:var(--bone-dim);background:transparent;border:0;padding:10px 17px;cursor:pointer;transition:.18s;display:flex;align-items:center;gap:7px}
  .seg button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
  .seg button.active{background:var(--whero);color:#fff}
  .count{font-size:.84rem;color:var(--bone-dim);white-space:nowrap;margin-left:auto}
  .count b{color:var(--bone)}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .chips::-webkit-scrollbar{height:6px}
  .chips::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--ink-2);color:var(--bone-dim);font-family:inherit;font-size:.82rem;font-weight:500;padding:8px 15px;border-radius:100px;cursor:pointer;transition:.18s;white-space:nowrap}
  .chip:hover{border-color:var(--bone-dim);color:var(--bone)}
  .chip.active{background:var(--whero);border-color:var(--whero);color:#fff}

  /* Phones: the sticky bar is laid out explicitly rather than left to wrap.
     Row 1 search, row 2 grouping + view switcher, row 3 chips. The view
     switcher drops to icons only (labels kept for screen readers) and the
     match count goes below 560px — the chips already carry counts. */
  @media(max-width:900px){
    .controls{padding:10px 0}
    .controls-inner{gap:8px}
    .search{flex:1 1 100%;min-width:0;order:1}
    #sortWrap,#groupWrap{order:2}
    #viewSeg{order:3;margin-left:auto}
    .count{order:4;width:100%;margin-left:0;text-align:right}
    .search input{font-size:.9rem;padding:10px 14px 10px 38px}
    .search svg{left:13px;width:16px;height:16px}
    .select select{font-size:.8rem;padding:9px 30px 9px 13px}
    .select::after{right:13px}
    .seg button{padding:9px 14px;gap:0}
    .seg button svg{width:17px;height:17px}
    .seg button .lbl{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
    .chips{padding:9px 0 2px;gap:6px}
    .chip{font-size:.78rem;padding:7px 12px}
    .pool-legend{gap:6px 12px;font-size:.74rem;margin-bottom:14px}
  }
  @media(max-width:560px){ .count{display:none} }
  .chip .c{opacity:.7;font-variant-numeric:tabular-nums;margin-left:5px}

  main{padding:16px 0 24px}

  /* Card grid — 3 up */
  .region-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;align-items:stretch}
  @media(max-width:920px){.region-grid{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:600px){.region-grid{grid-template-columns:1fr}}
  .region{border:1px solid var(--line);border-radius:var(--radius);background:var(--ink-2);overflow:hidden;scroll-margin-top:112px;animation:rise .5s both}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .region-head{padding:20px 20px 16px;border-bottom:1px solid var(--line);position:relative}
  .region-head::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--whero)}
  .r-index{font-size:.68rem;letter-spacing:.16em;color:var(--kowhai);font-weight:600;text-transform:uppercase;display:block;margin-bottom:6px}
  .r-name{font-family:'Inter',serif;font-weight:600;font-size:1.42rem;line-height:1.08;color:var(--bone)}
  .r-meta{font-size:.8rem;color:var(--bone-dim);margin-top:7px}
  .r-meta span{color:var(--pounamu)}
  .r-badge{display:inline-block;margin-top:12px;font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--kowhai);border:1px solid var(--line);border-radius:100px;padding:5px 12px}

  .teams{list-style:none;padding:8px 10px 12px}
  .team{display:flex;align-items:flex-start;gap:13px;padding:11px 10px;border-radius:10px;transition:background .15s}
  .team:hover{background:var(--ink-3)}
  .place{flex:0 0 auto;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600;font-size:1.05rem;background:var(--ink);border:1px solid var(--line);color:var(--bone-dim)}
  .team.gold .place{background:linear-gradient(150deg,var(--kowhai),#b5812a);color:#2a1d08;border-color:transparent}
  .tname{font-weight:600;font-size:.97rem;color:var(--bone);letter-spacing:-.01em;line-height:1.3}
  .tsub{font-size:.76rem;color:var(--bone-dim);margin-top:2px}
  .tags{margin-top:5px;display:flex;flex-wrap:wrap;gap:5px}
  .tag{display:inline-block;font-size:.62rem;letter-spacing:.05em;text-transform:uppercase;font-weight:700;color:var(--pounamu);border:1px solid rgba(92,144,121,.4);border-radius:6px;padding:2px 6px}
  .tag.win{color:var(--whero);border-color:rgba(207,67,39,.45)}
  .tag.pool{color:#fff;background:var(--pool);border-color:transparent}
  [data-pool="Te Ihu"] .tag.pool{color:#20240a}
  mark{background:rgba(224,169,63,.35);color:var(--bone);border-radius:3px;padding:0 2px}

  /* Table view */
  .table-wrap{border:1px solid var(--line);border-radius:var(--radius);overflow-x:auto;background:var(--ink-2)}
  table{width:100%;border-collapse:collapse;min-width:880px}
  thead th{position:sticky;top:0;background:var(--ink-3);text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--bone-dim);font-weight:600;padding:14px 16px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
  thead th:hover{color:var(--bone)}
  thead th .arrow{opacity:0;margin-left:6px;font-size:.7em;font-family:'Inter',system-ui,sans-serif}
  thead th.sorted{color:var(--kowhai)}
  thead th.sorted .arrow{opacity:1}
  tbody tr{height:54px}
  tbody td{padding:13px 16px;border-bottom:1px solid rgba(58,44,34,.6);font-size:.92rem;vertical-align:middle}
  td.team-cell{white-space:nowrap}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:var(--ink-3)}
  td.team-cell{font-weight:600;color:var(--bone)}
  td.rohe-cell{color:var(--bone-dim)}
  .pill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;padding:3px 9px;border-radius:8px;font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem;background:var(--ink);border:1px solid var(--line);color:var(--bone-dim)}
  .pill.gold{background:linear-gradient(150deg,var(--kowhai),#b5812a);color:#2a1d08;border-color:transparent}
  .yes{color:var(--pounamu);font-weight:600}
  .no{color:#6b5d4d}

  /* Draw view */
  .day{border:1px solid var(--line);border-radius:var(--radius);background:var(--ink-2);overflow:hidden;margin-bottom:14px;scroll-margin-top:112px;animation:rise .5s both}
  .day-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;padding:18px 22px;border-bottom:1px solid var(--line);background:var(--ink-3)}
  .day-n{font-family:var(--display);font-weight:900;font-size:1.5rem;line-height:1;color:var(--bone)}
  .day-date{font-size:.86rem;color:var(--bone-dim)}
  .day-count{margin-left:auto;font-size:.76rem;letter-spacing:.1em;text-transform:uppercase;color:var(--kowhai);font-weight:600;white-space:nowrap}
  .day-note{padding:9px 22px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#8a7a66;font-weight:600;background:rgba(0,0,0,.18);border-bottom:1px solid var(--line)}

  /* The four pool columns share one set of rows, so row 1 of Te Ihu sits level
     with row 1 of Te Haumi, Te Kei and Te Awa even when a name wraps to two
     lines. The item rows are 1fr, so every row in a section is the same height
     — set by the tallest name in it. --rows is written inline per section. */
  /* Four explicit columns, never auto-fit. Each .pool spans every row via
     subgrid, so if the track count ever drops to 3 the fourth pool is pushed
     into an implicit column and clipped by .day's overflow:hidden. At iframe
     widths auto-fit did exactly that, hiding Te Awa. Below --stack the whole
     grid becomes a single stacked list instead. */
  .pool-grid{display:grid;grid-template-columns:repeat(4,1fr);
    grid-template-rows:auto repeat(var(--rows,4),1fr) 10px;
    column-gap:1px;row-gap:0;background:var(--line)}
  .pool{background:var(--ink-2);padding:0;display:grid;grid-row:1/-1;grid-template-rows:subgrid;row-gap:0}
  .pool-head{display:flex;align-items:center;gap:9px;padding:13px 16px 11px;border-bottom:1px solid var(--line)}
  .pool-head::before{content:"";width:4px;height:17px;border-radius:2px;background:var(--pool,var(--whero))}
  .pool-name{font-size:.76rem;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:var(--bone)}
  .pool-n{margin-left:auto;font-size:.72rem;color:var(--bone-dim);font-variant-numeric:tabular-nums}
  .draw-list{display:contents}
  .draw-item{display:flex;align-items:flex-start;gap:11px;padding:8px;margin:0 10px;border-radius:9px;transition:background .15s}
  .draw-item:first-of-type{margin-top:8px}
  .draw-item:hover{background:var(--ink-3)}

  /* Older browsers without subgrid: rows won't lock together, so hold a common
     minimum height instead. Two-line names still push their own row taller. */
  @supports not (grid-template-rows:subgrid){
    .pool-grid{grid-template-rows:none}
    .pool{display:block;padding:0 0 10px}
    .draw-list{display:block;padding:8px 10px 0}
    .draw-item{margin:0;min-height:62px}
  }
  /* Phones: the four pools stack into a single column so the whole day reads as
     one continuous scroll. Shared subgrid rows are switched off — with one
     column there is nothing to line up, and leaving them on pushes pools 2-4
     into implicit columns off the side of the screen. */
  @media(max-width:900px){
    .pool-grid{display:block;grid-template-rows:none;background:var(--ink-2)}
    .pool{display:block;padding:0 0 8px;border-top:1px solid var(--line)}
    .pool:first-child{border-top:0}
    .draw-list{display:block;padding:6px 8px 0}
    .draw-item{margin:0;min-height:0}
    .day{scroll-margin-top:100px}
    .day-head{padding:14px 16px}
    .day-note{padding:8px 16px}
    .day-n{font-size:1.3rem}
  }
  .draw-no{flex:0 0 auto;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:.92rem;font-variant-numeric:tabular-nums;background:var(--pool,var(--line));color:#fff}
  [data-pool="Te Ihu"] .draw-no{color:#20240a}
  .draw-name{font-weight:600;font-size:.9rem;line-height:1.3;color:var(--bone);letter-spacing:-.01em}
  .draw-sub{font-size:.72rem;color:var(--bone-dim);margin-top:2px}

  .pool-legend{display:flex;flex-wrap:wrap;gap:7px 16px;margin:0 0 13px;font-size:.78rem;color:var(--bone-dim)}
  .pool-legend span{display:inline-flex;align-items:center;gap:7px}
  .pool-legend i{width:11px;height:11px;border-radius:3px;background:var(--pool);display:inline-block}

  /* Official graphics */
  .graphics{margin-top:22px;border-top:1px solid var(--line);padding-top:18px}
  .graphics h2{font-family:var(--display);font-weight:600;font-size:1.15rem;color:var(--bone);margin-bottom:5px}
  .graphics p{font-size:.84rem;color:var(--bone-dim);max-width:62ch;margin-bottom:16px}
  .gal{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  @media(max-width:800px){.gal{grid-template-columns:repeat(2,1fr)}}
  .gal a{display:block;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ink-2);text-decoration:none;transition:border-color .18s,transform .18s}
  .gal a:hover{border-color:var(--kowhai);transform:translateY(-2px)}
  .gal img{display:block;width:100%;height:auto;background:var(--ink-3)}
  .gal .cap{padding:9px 11px;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--bone-dim)}

  .empty{text-align:center;padding:60px 20px;color:var(--bone-dim);display:none}
  .empty.show{display:block}
  .empty .big{font-family:var(--display);font-size:1.4rem;color:var(--bone);margin-bottom:8px}
  .hidden{display:none}

  :focus-visible{outline:2px solid var(--kowhai);outline-offset:2px;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>



<div class="controls">
  <div class="wrap">
    <div class="controls-inner">
      <label class="search">
        <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Search for a kapa…" autocomplete="off" aria-label="Search for a kapa haka team">
      </label>

      <div class="select" id="sortWrap">
        <select id="sort" aria-label="Sort rohe by">
          <option value="date">Sort: regionals date</option>
          <option value="alpha">Sort: A–Z by rohe</option>
        </select>
      </div>

      <div class="select" id="groupWrap">
        <select id="group" aria-label="Group draw by">
          <option value="day">Group: by day</option>
          <option value="pool">Group: by pool</option>
        </select>
      </div>

      <div class="seg" id="viewSeg" role="tablist" aria-label="View">
        <button data-v="draw" class="active" role="tab" aria-selected="true">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
          <span class="lbl">Draw</span>
        </button>
        <button data-v="cards" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span class="lbl">Rohe</span>
        </button>
        <button data-v="table" role="tab" aria-selected="false">
          <svg viewBox="0 0 24 24"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <span class="lbl">Table</span>
        </button>
      </div>

      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<main>
  <div class="wrap">
    <div class="pool-legend" id="legend"></div>
    <div id="drawView"></div>
    <div id="cardView" class="region-grid hidden"></div>
    <div id="tableView" class="table-wrap hidden">
      <table>
        <thead><tr>
          <th data-k="team">Team <span class="arrow"></span></th>
          <th data-k="rohe">Rohe <span class="arrow"></span></th>
          <th data-k="pool">Pool <span class="arrow"></span></th>
          <th data-k="day">Day <span class="arrow"></span></th>
          <th data-k="ord">Order on day <span class="arrow"></span></th>
          <th data-k="place">Regional placing <span class="arrow"></span></th>
          <th data-k="debut">Te Matatini debutant <span class="arrow"></span></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
    <div class="empty" id="empty">
      <div class="big">No kapa found</div>
      <div>Try a different name, or clear the search to see every qualifier.</div>
    </div>

    <section class="graphics" id="graphics">
      <h2>Official draw graphics</h2>
      <p>The same information as released by Te Matatini. Select a tile to open the full-size image.</p>
      <div class="gal" id="gal"></div>
    </section>
  </div>
</main>

<script>
const DATA = [
  { rohe:"Ngāti Kahungunu", name:"Ngāti Kahungunu", loc:"Waipukurau, Hawke's Bay", date:"14 February 2026", teams:[
    {p:1,n:"Te Rangiura o Wairarapa"},{p:2,n:"Te Kapa Haka o Kahungunu"},{p:3,n:"Te Kapa Haka o Ngāti Ranginui"},{p:4,n:"Mātangirau"} ]},
  { rohe:"Mātaatua", name:"Mātaatua", loc:"Whakatāne", date:"27–28 February 2026", teams:[
    {p:1,n:"Te Taumata o Apanui"},{p:2,n:"Ōhinemataroa ki Ruatāhuna"},{p:3,n:"Ōpōtiki Mai Tawhiti"},{p:4,n:"Te Whakatōhea", debut:true},{p:5,n:"Tauira Mai Tawhiti"},{p:6,n:"Te Whānau-ā-Apanui"} ]},
  { rohe:"Te Kāhui Maunga", name:"Te Kāhui Maunga", loc:"Waitara, Taranaki", date:"7 March 2026", teams:[
    {p:1,n:"Ngā Purapura o Te Taihauāuru"},{p:2,n:"Te Reanga Morehu o Rātana"},{p:3,n:"Ngā Waihotanga"},{p:4,n:"Te Kura Nui o Paerangi"} ]},
  { rohe:"Te Arawa", name:"Te Arawa", loc:"Rotorua", date:"14 March 2026", note:"Joint winners", teams:[
    {p:1,n:"Te Pikikōtuku o Ngāti Rongomai", joint:true},{p:1,n:"Te Kapa Haka o Ngāti Whakaue", joint:true},{p:3,n:"Te Hekenga-ā-rangi"},{p:4,n:"Ngāti Rangiwewehi"},{p:5,n:"Te Whare Haka o Te Puku", debut:true},{p:6,n:"Te Kapa Haka o Tūhourangi Ngāti Wāhiao"} ]},
  { rohe:"Te Whenua Moemoeā", name:"Te Whenua Moemoeā", loc:"Gold Coast, Australia", date:"28 March 2026", teams:[

/* Sanity check for hand-entered numbers. Each day's dayNo values should run
   1..n with no gaps or repeats, and the same for each pool's poolNo values.
   Anything off is listed in the browser console — the page still renders. */
function checkRun(label, nums){
  const sorted=[...nums].sort((a,b)=>a-b);
  const bad=sorted.filter((v,i)=>v!==i+1);
  if(bad.length) console.warn(`${label}: expected 1..${nums.length}, got ${sorted.join(',')}`);
}
DAYS.forEach(day=>{
  const onDay=DRAW.filter(x=>x.d===day.d);
  day.n=onDay.length;
  checkRun(`${day.ra} dayNo`, onDay.map(x=>x.dayNo));
});

  const inPool=DRAW.filter(x=>x.pool===pool);
  checkRun(`${pool} poolNo`, inPool.map(x=>x.poolNo));
});

/* Below this width the sticky bar is in its condensed layout, so the control
   labels are shortened to match ("Group: by day" -> "By day", and day chips
   lose the date). Re-run whenever the breakpoint is crossed. */
const compactMQ=window.matchMedia('(max-width:900px)');
const isCompact=()=>compactMQ.matches;
function syncLabels(){
  const c=isCompact(), g=document.getElementById('group').options, so=document.getElementById('sort').options;
  g[0].textContent = c?'By day':'Group: by day';
  g[1].textContent = c?'By pool':'Group: by pool';

let activeRegion="all", activeDay="all", query="", sortMode="date", groupMode="day", view="draw";
let tableSort={key:"day", dir:1};

// flat list for the table; remember chronological order index
const FLAT=[];
DATA.forEach((r,ri)=>r.teams.forEach(t=>FLAT.push({
  team:t.n, rohe:r.name, place:t.p, joint:!!t.joint, debut:!!t.debut, order:ri,
  pool:t.pool||'', day:t.day||0, o:t.o||0, dayOrd:t.dayOrd||0
})));

const strip=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"");
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function highlight(name,q){
  if(!q) return esc(name);
  const i=strip(name).toLowerCase().indexOf(q);
  if(i<0) return esc(name);
  return esc(name.slice(0,i))+'<mark>'+esc(name.slice(i,i+q.length))+'</mark>'+esc(name.slice(i+q.length));
}
const matchQ=name=> !query || strip(name).toLowerCase().includes(query);

function buildChips(){
  chipsEl.innerHTML='';
  if(view==="draw"){
    chipsEl.insertAdjacentHTML('beforeend',
      `<button class="chip${activeDay==='all'?' active':''}" data-d="all">All days <span class="c">57</span></button>`);
    DAYS.forEach(d=>{
      const n=DRAW.filter(x=>x.d===d.d).length;
      const label = isCompact() ? d.ra : `${d.ra} · ${d.date.replace(' 2027','')}`;
      chipsEl.insertAdjacentHTML('beforeend',
        `<button class="chip${String(activeDay)===String(d.d)?' active':''}" data-d="${d.d}">${label} <span class="c">${n}</span></button>`);
    });
  } else {
    chipsEl.insertAdjacentHTML('beforeend',
      `<button class="chip${activeRegion==='all'?' active':''}" data-r="all">All rohe <span class="c">57</span></button>`);
    DATA.forEach(r=>{
      chipsEl.insertAdjacentHTML('beforeend',
        `<button class="chip${activeRegion===r.name?' active':''}" data-r="${r.name}">${r.name} <span class="c">${r.teams.length}</span></button>`);
    });
  }
}

chipsEl.addEventListener('click',e=>{
  const chip=e.target.closest('.chip'); if(!chip) return;
  [...chipsEl.children].forEach(c=>c.classList.toggle('active',c===chip));
  if(view==="draw"){ activeDay=chip.dataset.d; render(); return; }
  activeRegion=chip.dataset.r;
  render();
  if(view==="cards" && activeRegion!=="all"){
    const node=document.querySelector(`[data-region="${CSS.escape(activeRegion)}"]`);
    if(node) node.scrollIntoView({behavior:'smooth',block:'start'});
  }
});

/* ---- Draw view -------------------------------------------------
   Blocks mirror the official graphic: pools in fixed order, teams
   listed with the draw number Te Matatini published for them.
------------------------------------------------------------------*/
function drawItem(x){
  const num = groupMode==="pool" ? x.o : x.dayOrd;
  const sub = groupMode==="pool" ? x.rohe : `${x.rohe}`;
  return `<li class="draw-item">
    <div class="draw-no">${num}</div>
    <div>
      <div class="draw-name">${highlight(x.team,query)}</div>
      <div class="draw-sub">${sub}</div>
    </div></li>`;
}

function poolBlock(pool, rows, label){
  return `<div class="pool" data-pool="${pool}">
    <div class="pool-head">
      <span class="pool-name">${label||pool}</span>
      <span class="pool-n">${rows.length}</span>
    </div>
    <ul class="draw-list" role="list" style="list-style:none">${rows.map(drawItem).join('')}</ul>
  </div>`;
}

function renderDraw(){
  drawView.innerHTML=''; let shown=0, delay=0;
  const rows=FLAT.filter(x=>x.day && matchQ(x.team));

  if(groupMode==="pool"){
    POOLS.forEach(pool=>{
      const mine=rows.filter(x=>x.pool===pool && (activeDay==="all"||String(x.day)===String(activeDay)));
      if(query && mine.length===0) return;
      shown+=mine.length;
      const days=DAYS.filter(d=>activeDay==="all"||String(d.d)===String(activeDay));
      const cols=days.map(d=>{
        const inDay=mine.filter(x=>x.day===d.d).sort((a,b)=>a.o-b.o);
        return poolBlock(pool, inDay, `${d.ra} · ${d.date.replace(' 2027','')}`);
      }).join('');
      const rowCount=Math.max(1,...days.map(d=>mine.filter(x=>x.day===d.d).length));
      const sec=document.createElement('section');
      sec.className='day'; sec.dataset.pool=pool;
      sec.style.animationDelay=(delay++*0.05)+'s';
      sec.innerHTML=`
        <div class="day-head" style="border-left:4px solid var(--pool)">
          <span class="day-n">${pool}</span>
          <span class="day-date">Top 3 advance to finals day</span>
          <span class="day-count">${mine.length} kapa</span>
        </div>
        <div class="day-note">Numbers show each kapa's place in the pool draw</div>
        <div class="pool-grid" style="--rows:${rowCount}">${cols}</div>`;
      drawView.appendChild(sec);
    });
    return shown;
  }

  DAYS.forEach(d=>{
    if(activeDay!=="all" && String(d.d)!==String(activeDay)) return;
    const mine=rows.filter(x=>x.day===d.d);
    if(query && mine.length===0) return;
    shown+=mine.length;
    const cols=POOLS.map(p=>poolBlock(p, mine.filter(x=>x.pool===p).sort((a,b)=>a.dayOrd-b.dayOrd))).join('');
    const rowCount=Math.max(1,...POOLS.map(p=>mine.filter(x=>x.pool===p).length));
    const sec=document.createElement('section');
    sec.className='day'; sec.dataset.day=d.d;
    sec.style.animationDelay=(delay++*0.05)+'s';
    sec.innerHTML=`
      <div class="day-head">
        <span class="day-n">${d.ra}</span>
        <span class="day-date">${d.day} ${d.date}</span>
        <span class="day-count">${mine.length} kapa</span>
      </div>
      <div class="day-note">Numbers show the order of performance on the day</div>
      <div class="pool-grid" style="--rows:${rowCount}">${cols}</div>`;
    drawView.appendChild(sec);
  });
  return shown;
}

function buildGallery(){

function renderCards(){
  cardView.innerHTML=''; let shown=0, d=0;
  orderedRegions().forEach(({r,i})=>{
    if(activeRegion!=="all" && r.name!==activeRegion) return;
    const teams=r.teams.filter(t=>matchQ(t.n));
    if(query && teams.length===0) return;
    shown += teams.length;

    const sec=document.createElement('section');
    sec.className='region'; sec.dataset.region=r.name;
    sec.style.animationDelay=(d++*0.04)+'s';
    const badge=r.note?`<span class="r-badge">${r.note} &middot; ${r.teams.length} qualified</span>`:`<span class="r-badge">${r.teams.length} qualified</span>`;
    const list=teams.map(t=>{
      const gold=t.p===1?'gold':'';
      const placeLabel=t.joint?'1<span style="font-size:.65em">=</span>':t.p;
      let tags='';
      if(t.pool) tags+=`<span class="tag pool">&nbsp${t.pool} - Day ${t.day}&nbsp</span>`;
      if(t.p===1) tags+=`<span class="tag win">${t.joint?'Joint winner':'Regional winner'}</span>`;
      if(t.debut) tags+=`<span class="tag">Debut</span>`;
      const drawn = t.day ? `` : '';
      return `<li class="team ${gold}" data-pool="${t.pool||''}">
        <div class="place">${placeLabel}</div>
        <div>
          <div class="tname">${highlight(t.n,query)}</div>
          <div class="tsub">${ord[t.p]||t.p+'th'} place${drawn}</div>
          ${tags?`<div class="tags">${tags}</div>`:''}
        </div></li>`;
    }).join('');
    sec.innerHTML=`
      <div class="region-head">
        <div class="r-name">${r.name}</div>
        <div class="r-meta"><span>${r.loc}</span> &middot; ${r.date}</div>
        ${badge}
      </div>
      <ul class="teams">${list}</ul>`;
    cardView.appendChild(sec);
  });
  return shown;
}

function renderTable(){
  let rows=FLAT.filter(x=>(activeRegion==="all"||x.rohe===activeRegion) && matchQ(x.team));
  const {key,dir}=tableSort;
  const byDraw=(a,b)=>a.day-b.day||a.dayOrd-b.dayOrd||strip(a.team).localeCompare(strip(b.team));
  rows.sort((a,b)=>{
    let c=0;
    if(key==="team") c=strip(a.team).localeCompare(strip(b.team));
    else if(key==="rohe") c=strip(a.rohe).localeCompare(strip(b.rohe))||a.place-b.place;
    else if(key==="pool") c=POOLS.indexOf(a.pool)-POOLS.indexOf(b.pool)||a.o-b.o;
    else if(key==="day") c=byDraw(a,b);
    else if(key==="ord") c=a.dayOrd-b.dayOrd||a.day-b.day;
    else if(key==="poolno") c=a.o-b.o||POOLS.indexOf(a.pool)-POOLS.indexOf(b.pool);
    else if(key==="place") c=a.place-b.place||strip(a.rohe).localeCompare(strip(b.rohe));
    else if(key==="debut") c=(b.debut-a.debut)||strip(a.team).localeCompare(strip(b.team));
    return c*dir;
  });
  tbody.innerHTML=rows.map(x=>{
    const placeLabel=(ord[x.place]||x.place+'th')+(x.joint?' (tie)':'');
    return `<tr data-pool="${x.pool}">
      <td class="team-cell">${highlight(x.team,query)}</td>
      <td class="rohe-cell">${x.rohe}</td>
      <td>${x.pool?`<span class="tag pool">${x.pool}</span>`:'<span class="no">—</span>'}</td>
      <td class="rohe-cell">${x.day?`Rā ${x.day}`:'—'}</td>
      <td><span class="pill">${x.dayOrd||'—'}</span></td>
      <td><span class="pill ${x.place===1?'gold':''}">${x.place}</span> <span style="color:var(--bone-dim);font-size:.84rem">${placeLabel}</span></td>
      <td>${x.debut?'<span class="yes">Yes</span>':'<span class="no">—</span>'}</td>
    </tr>`;
  }).join('');
  document.querySelectorAll('thead th').forEach(th=>{
    const on=th.dataset.k===key;
    th.classList.toggle('sorted',on);
    th.querySelector('.arrow').textContent= on ? (dir===1?'▲':'▼') : '';
  });
  return rows.length;
}

function render(){
  let shown=0;
  drawView.classList.add('hidden'); cardView.classList.add('hidden'); tableView.classList.add('hidden');
  sortWrap.style.display = view==="cards" ? '' : 'none';
  groupWrap.style.display = view==="draw" ? '' : 'none';
  legendEl.style.display = view==="draw" ? '' : 'none';

  if(view==="draw"){ shown=renderDraw(); drawView.classList.toggle('hidden',shown===0); }
  else if(view==="cards"){ shown=renderCards(); cardView.classList.toggle('hidden',shown===0); }
  else { shown=renderTable(); tableView.classList.toggle('hidden',shown===0); }

  emptyEl.classList.toggle('show',shown===0);

  if(query) countEl.innerHTML=`<b>${shown}</b> kapa match`;
  else if(view==="draw" && activeDay!=="all") countEl.innerHTML=`<b>${shown}</b> kapa on this day`;
  else if(view!=="draw" && activeRegion!=="all") countEl.innerHTML=`<b>${shown}</b> kapa in this rohe`;
}

searchEl.addEventListener('input',()=>{
  query=strip(searchEl.value.trim()).toLowerCase();
  if(query){
    activeRegion="all"; activeDay="all";
    [...chipsEl.children].forEach(c=>c.classList.toggle('active',(c.dataset.r||c.dataset.d)==="all"));
  }
  render();
});
document.getElementById('sort').addEventListener('change',e=>{sortMode=e.target.value;render();});
document.getElementById('group').addEventListener('change',e=>{groupMode=e.target.value;render();});
document.getElementById('viewSeg').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  view=b.dataset.v;
  [...e.currentTarget.children].forEach(x=>{const on=x===b;x.classList.toggle('active',on);x.setAttribute('aria-selected',on);});
  buildChips();
  render();
});
document.querySelector('thead').addEventListener('click',e=>{
  const th=e.target.closest('th'); if(!th) return;
  const k=th.dataset.k;
  if(tableSort.key===k) tableSort.dir*=-1;
  else tableSort={key:k, dir:1};
  renderTable();
});


/* ---------------------------------------------------------------
   Iframe height reporting.
   Posts this document's height to the parent page whenever it
   changes, so the embed can be sized to fit. Harmless if nothing
   is listening. The parent listens like this:

     window.addEventListener('message', function (e) {
       if (e.data && e.data.tmDrawHeight) {
         document.getElementById('tm-frame').style.height =
           e.data.tmDrawHeight + 'px';
       }
     });

   NOTE: only use this if you want a full-height frame. Auto-sizing
   means the frame never scrolls internally, so the sticky filter bar
   has nothing to stick to and will scroll away. A fixed-height frame
   that scrolls internally keeps the sticky bar working.
----------------------------------------------------------------*/
function reportHeight(){
  if(window.parent===window) return;          // not embedded
  const h=Math.ceil(document.documentElement.scrollHeight);
  if(h===reportHeight.last) return;
  reportHeight.last=h;
  window.parent.postMessage({tmDrawHeight:h},'*');
}
if(window.parent!==window){
  if(window.ResizeObserver) new ResizeObserver(reportHeight).observe(document.body);
  window.addEventListener('load',reportHeight);
  window.addEventListener('resize',reportHeight);
}

syncLabels();
buildChips();
buildLegend();
buildGallery();
render();
</script>
